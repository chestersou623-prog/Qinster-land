<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Qinster v230 · 遗物图标验收</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#c9c8cd;color:#26232c;font:14px system-ui}h1{font-size:20px}.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px}.review-cell{min-height:115px;display:grid;justify-items:center;gap:8px;padding:8px}iframe{width:390px;max-width:100%;height:700px;border:2px solid #555}#mobile-review{margin-top:35px}</style></head><body><h1>v230 · 28 个遗物图标</h1><p>与游戏共用正式 JS、样式和图片。悬停、点击或用键盘查看详情。</p><div id="review-grid" class="review-grid"></div><h2>重复遗物合并</h2><div id="stack-review"></div><section id="mobile-review"><h2>390px 手机宽度</h2><iframe title="手机遗物预览" src="art/relic-review.html?compact=1"></iframe></section><script src="v199-roguelike-expedition.js?v=230.1"></script><script>
window.addEventListener('load',()=>{const R=window.QinsterRelics;document.getElementById('review-grid').innerHTML=R.all.map(r=>'<div class="review-cell">'+R.iconHTML(r.id)+'<span>'+r.name+'</span></div>').join('');document.getElementById('stack-review').innerHTML=R.trayHTML({relics:['fang','fang','fateWeight','fateWeight','fateWeight']});});
if(location.search.includes('compact'))document.getElementById('mobile-review').remove();
</script></body></html>
