name: Qinster v226 training camp
on:
  push:
    paths:
      - 'scripts/patch-v226-training-camp.py'
      - '.github/workflows/v226-training-camp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v226 patch
        run: python scripts/patch-v226-training-camp.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add training camp roguelike upgrades'
            git push
          fi
