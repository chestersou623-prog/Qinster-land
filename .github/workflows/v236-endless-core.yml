name: Qinster v236 endless expedition core
on:
  push:
    paths:
      - 'scripts/patch-v236-infinite-core.py'
      - '.github/workflows/v236-endless-core.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v236 patch
        run: python scripts/patch-v236-infinite-core.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js game.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add endless floor progression and 25 percent failure payout v236'
            git push
          fi
