name: Qinster v249 HP relics

on:
  push:
    paths:
      - '.github/workflows/v249-hp-relics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v249-hp-relics.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify HP relics
        run: |
          grep -F "name:'生命圣杯'" v199-roguelike-expedition.js
          grep -F "name:'血铸利刃'" v199-roguelike-expedition.js
          grep -F "missingHpAtkPer10" v199-roguelike-expedition.js
          grep -F "game.js?v=249" index.html
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html v199-roguelike-expedition.js v201-battle-theater.js
          git rm scripts/patch-v249-hp-relics.py .github/workflows/v249-hp-relics.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add HP build relics v249"
          git push
