name: Qinster v272 battle pacing frontline
on:
  push:
    paths:
      - 'scripts/patch-v272-battle-pacing-frontline.py'
      - '.github/workflows/v272-battle-pacing-frontline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Apply patch
        run: python scripts/patch-v272-battle-pacing-frontline.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          node scripts/check-picker.mjs
      - name: Verify v272
        run: |
          grep -q "const target=current\[0\]" v199-roguelike-expedition.js
          grep -q "严格优先前卫" v199-roguelike-expedition.js
          grep -q "1850" v201-battle-theater.js
          grep -q "qinster-v272-battle-theater-style" v201-battle-theater.js
          grep -q "__qinsterVersion='v272'" game.js
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v272-battle-pacing-frontline.py .github/workflows/v272-battle-pacing-frontline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Slow battle replay and enforce frontline targeting v272' || exit 0
          git push
