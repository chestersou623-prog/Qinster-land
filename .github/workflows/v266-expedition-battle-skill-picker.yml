name: Qinster v266 expedition battle skill picker
on:
  push:
    paths:
      - 'scripts/patch-v266-expedition-battle-skill-picker.py'
      - '.github/workflows/v266-expedition-battle-skill-picker.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/patch-v266-expedition-battle-skill-picker.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check picker.js
      - name: Tests
        run: npm test
      - name: Verify v266
        run: |
          grep -q "cfg.placeholder='名字 / 战斗技能 / #编号'" v199-roguelike-expedition.js
          grep -q "rg-exp-skill" v199-roguelike-expedition.js
          grep -q "v266 expedition picker" picker.css
          grep -q '"version": "266.0.0"' package.json
      - name: Commit generated changes and remove one-shot files
        run: |
          rm scripts/patch-v266-expedition-battle-skill-picker.py
          rm .github/workflows/v266-expedition-battle-skill-picker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show expedition battle skills in picker v266'
          git push
