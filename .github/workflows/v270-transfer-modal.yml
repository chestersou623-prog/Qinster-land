name: Qinster v270 transfer modal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v270-transfer-modal.py'
      - '.github/workflows/v270-transfer-modal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 scripts/patch-v270-transfer-modal.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v270
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e=Path('v199-roguelike-expedition.js').read_text()
          g=Path('game.js').read_text()
          i=Path('index.html').read_text()
          p=Path('package.json').read_text()
          checks=[
            ('modal', 'function transferModalHTML' in e and 'data-rg-transfer-overlay' in e),
            ('no native confirm','window.confirm(`将 ${monsterName(m)}' not in e),
            ('confirm action','data-rg-transfer-confirm' in e),
            ('price visible','转籍费用' in e),
            ('compare','牧场原值' in e and '远征基础值' in e),
            ('version',"version:'v270'" in e),
            ('visible',"__qinsterVersion='v270'" in g),
            ('cache','game.js?v=270' in i and 'v199-roguelike-expedition.js?v=270' in i),
            ('package','"version": "270.0.0"' in p),
          ]
          bad=[n for n,ok in checks if not ok]
          if bad: raise SystemExit('verification failed: '+', '.join(bad))
          print('v270 verification ok')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-v270-transfer-modal.py .github/workflows/v270-transfer-modal.yml
          git add -A
          git commit -m 'Replace transfer confirm with game modal v270'
          git push
