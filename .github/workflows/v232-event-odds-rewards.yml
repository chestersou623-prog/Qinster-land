name: Qinster v232 event odds and rewards
on:
  push:
    paths:
      - 'scripts/patch-v232-event-odds-rewards.py'
      - '.github/workflows/v232-event-odds-rewards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v232 patch
        run: python scripts/patch-v232-event-odds-rewards.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js game.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Show event success and reward preview and bump v232'
            git push
          fi
