name: Qinster v261 revive charges
on:
  push:
    paths:
      - 'scripts/patch-v261-revive-charges.py'
      - '.github/workflows/v261-revive-charges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-v261-revive-charges.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify v261 revive charges
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v199-roguelike-expedition.js').read_text(encoding='utf-8')
          x=Path('index.html').read_text(encoding='utf-8')
          assert "mods:{autoReviveCharges:1}" in s
          assert "run.autoReviveUsed=reviveUsed+1" in s
          assert "run.hp[target.id]=50" in s
          assert "复苏 ${Math.max(0" in s
          assert "每只怪物每场第一次" not in s
          assert 'v=261' in x
          assert "v261 ·" in x
          print('v261 revive charge verification passed')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          rm scripts/patch-v261-revive-charges.py .github/workflows/v261-revive-charges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make revival relic expedition-limited v261'
          git push
