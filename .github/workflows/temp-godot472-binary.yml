name: Temporary Godot 4.7.2 Binary

on:
  push:
    branches: [temp-godot472-binary-20260925]
    paths:
      - ".github/workflows/temp-godot472-binary.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --headless --version
      - name: Upload Godot binary
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux
          path: godot
          retention-days: 1
