name: Qinster v202 expedition life and formation

on:
  push:
    paths:
      - '.github/workflows/v202-expedition-life-formation.yml'
      - 'scripts/patch-v202.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v202 patch
        run: |
          python3 scripts/patch-v202.py
          node --check v199-roguelike-expedition.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v202-expedition-life-formation.yml
          rm scripts/patch-v202.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js .github/workflows/v202-expedition-life-formation.yml scripts/patch-v202.py
          git commit -m "Make expedition formation real and apply life wear"
          git push
