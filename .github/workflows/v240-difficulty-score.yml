name: Qinster v240 difficulty score and battle action

on:
  push:
    paths:
      - 'scripts/patch-v240-difficulty-score.py'
      - '.github/workflows/v240-difficulty-score.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v240-difficulty-score.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Tests
        run: npm test
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js game.js index.html
          git commit -m "Use enemy difficulty rating for rogue score and keep battle action visible"
          git push
