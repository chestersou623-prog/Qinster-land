name: Qinster tutorial v191

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_v191.py'
      - '.github/workflows/tutorial-v191.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v191 patch
        run: python3 scripts/patch_v191.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit v191
        run: |
          rm -f scripts/patch_v191.py .github/workflows/tutorial-v191.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js scripts/patch_v191.py .github/workflows/tutorial-v191.yml
          git commit -m "Add v191 onboarding tutorial and ranch naming"
          git push
