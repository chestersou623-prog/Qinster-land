name: Qinster v206 roguelike items debuffs and enemy stats

on:
  push:
    paths:
      - '.github/workflows/v206-roguelike-items-debuffs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v206 patch
        run: |
          python3 scripts/patch-v206b.py
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v206-roguelike-items-debuffs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js v201-battle-theater.js .github/workflows/v206-roguelike-items-debuffs.yml
          git commit -m "Add roguelike items debuffs and enemy stat readouts"
          git push
