name: Qinster v280 final stat display

on:
  push:
    paths:
      - 'scripts/patch-v280-final-stats.py'
      - '.github/workflows/v280-final-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply v280 patch
        run: python3 scripts/patch-v280-final-stats.py
      - name: Syntax checks
        run: |
          node --check game.js
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
      - name: Regression tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify final-stat UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rg=Path('v199-roguelike-expedition.js').read_text()
          bt=Path('v201-battle-theater.js').read_text()
          idx=Path('index.html').read_text()
          game=Path('game.js').read_text()
          pkg=Path('package.json').read_text()
          test=Path('scripts/check-picker.mjs').read_text()
          assert rg.startswith('/* Qinster release v280 */')
          assert 'rg-ally-mon' in rg
          assert '${finalStatsHTML(m,i,run)}' in rg
          assert "run?.battle?.allyInitialStats?.[m.id]" in rg
          assert ".rg-final-stat.up b{color:#64d887}" in rg
          assert ".rg-final-stat.down b{color:#ff7070}" in rg
          assert "#expedition-content .rg-team:not(.rg-enemy-team)" in rg
          assert bt.startswith('/* Qinster v280 · live final stat colors */')
          assert 'function allyStatCells' in bt
          assert '.rg-bt-statgrid i.up b{color:#64d887}' in bt
          assert '.rg-bt-statgrid i.down b{color:#ff7070}' in bt
          assert 'el.innerHTML=allyStatCells(m,q)' in bt
          assert 'rg-bt-enemy-finalstats' in bt
          assert "const BUILD='v280'" in idx
          assert '?v=279.1' not in idx and idx.count('?v=280') >= 8
          assert "window.__qinsterVersion='v280'" in game
          assert '"version": "280.0.0"' in pkg
          assert "assert.equal(w.__qinsterVersion,'v280')" in test
          print('v280 final-stat verification passed')
          PY
      - name: Commit v280 and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game.js v199-roguelike-expedition.js v201-battle-theater.js package.json package-lock.json scripts/check-picker.mjs
          git rm scripts/patch-v280-final-stats.py .github/workflows/v280-final-stats.yml
          git commit -m 'Show live final expedition stats v280'
          git push
