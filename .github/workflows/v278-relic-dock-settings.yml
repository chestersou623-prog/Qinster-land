name: Qinster v278 relic dock settings

on:
  push:
    paths:
      - 'scripts/patch-v278-relic-dock-settings.py'
      - '.github/workflows/v278-relic-dock-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 scripts/patch-v278-relic-dock-settings.py
      - name: Syntax checks
        run: |
          node --check game.js
          node --check v199-roguelike-expedition.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v278
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          game=Path('game.js').read_text()
          rg=Path('v199-roguelike-expedition.js').read_text()
          pkg=Path('package.json').read_text()
          assert 'v278 · 等待' in idx
          assert 'v278 · engine' in idx
          assert "const BUILD='v278'" in idx
          assert 'debug-overlay-visible' in idx and '设置 ⚙' in idx
          assert "window.__qinsterVersion='v278'" in game
          assert 'DEBUG_OVERLAY_PREF_KEY' in game
          assert 'rg-relic-detail-dock' in rg
          assert 'showRelicDetails' in rg
          assert "version:'v278'" in rg
          assert '278.0.0' in pkg
          assert '?v=278' in idx
          print('v278 verification passed')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game.js v199-roguelike-expedition.js package.json package-lock.json scripts/check-picker.mjs
          git rm scripts/patch-v278-relic-dock-settings.py .github/workflows/v278-relic-dock-settings.yml
          git commit -m 'Add relic side details and debug overlay setting v278'
          git push
