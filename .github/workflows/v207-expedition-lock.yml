name: Qinster v207 expedition activity lock

on:
  push:
    paths:
      - '.github/workflows/v207-expedition-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock expedition monsters from breeding and dispatch
        shell: python
        run: |
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text(encoding='utf-8')

          old="function blocked(s,now){const [a,b]=pair(s);if(!a||!b||a.id===b.id)return '请选择两只不同的怪物';if(s.dispatch&&[a.id,b.id].includes(s.dispatch.monsterId))return '亲代正在派遣中';"
          new="function blocked(s,now){const [a,b]=pair(s);if(!a||!b||a.id===b.id)return '请选择两只不同的怪物';const expeditionIds=s.expedition?.rogueActive?.teamIds||[];if(expeditionIds.includes(a.id)||expeditionIds.includes(b.id))return '亲代正在远征中';if(s.dispatch&&[a.id,b.id].includes(s.dispatch.monsterId))return '亲代正在派遣中';"
          if old not in s: raise SystemExit('blocked target not found')
          s=s.replace(old,new,1)

          old="function isDispatched(id){return dispatchedMonsters().some(m=>m.id===id);}\nfunction dispatchMission()"
          new="function isDispatched(id){return dispatchedMonsters().some(m=>m.id===id);}\nfunction isInActiveExpedition(id){return !!(s.expedition?.rogueActive?.teamIds||[]).includes(id);}\nfunction dispatchMission()"
          if old not in s: raise SystemExit('isDispatched target not found')
          s=s.replace(old,new,1)

          old="function canDispatchMonster(m){return !!(m&&!isDispatched(m.id)&&!isEggParent(m.id)&&m.life>0);}"
          new="function canDispatchMonster(m){return !!(m&&!isDispatched(m.id)&&!isInActiveExpedition(m.id)&&!isEggParent(m.id)&&m.life>0);}"
          if old not in s: raise SystemExit('canDispatch target not found')
          s=s.replace(old,new,1)

          old="if(a&&b&&!a.locked&&!b.locked&&a.life>0&&b.life>0&&!isDispatched(a.id)&&!isDispatched(b.id)&&a.gender!==b.gender)return [a,b];"
          new="if(a&&b&&!a.locked&&!b.locked&&a.life>0&&b.life>0&&!isDispatched(a.id)&&!isDispatched(b.id)&&!isInActiveExpedition(a.id)&&!isInActiveExpedition(b.id)&&a.gender!==b.gender)return [a,b];"
          if old not in s: raise SystemExit('smart breed cache target not found')
          s=s.replace(old,new,1)

          old="const eligible=s.monsters.filter(m=>!m.locked&&!isDispatched(m.id)&&m.life>0);"
          new="const eligible=s.monsters.filter(m=>!m.locked&&!isDispatched(m.id)&&!isInActiveExpedition(m.id)&&m.life>0);"
          if old not in s: raise SystemExit('smart breed eligible target not found')
          s=s.replace(old,new,1)

          old="m&&m.id!==anchor.id&&m.life>0&&!isDispatched(m.id)&&m.gender!==anchor.gender"
          new="m&&m.id!==anchor.id&&m.life>0&&!isDispatched(m.id)&&!isInActiveExpedition(m.id)&&m.gender!==anchor.gender"
          if old not in s: raise SystemExit('breed candidate target not found')
          s=s.replace(old,new,1)

          old="const a=s.monsters.find(m=>m.id===s.parentA&&m.life>0&&!isDispatched(m.id))||null;\n  const b=s.monsters.find(m=>m.id===s.parentB&&m.life>0&&!isDispatched(m.id))||null;"
          new="const a=s.monsters.find(m=>m.id===s.parentA&&m.life>0&&!isDispatched(m.id)&&!isInActiveExpedition(m.id))||null;\n  const b=s.monsters.find(m=>m.id===s.parentB&&m.life>0&&!isDispatched(m.id)&&!isInActiveExpedition(m.id))||null;"
          if old not in s: raise SystemExit('breed decision target not found')
          s=s.replace(old,new,1)

          old="if(isDispatched(id)){tell(name(s.monsters.find(m=>m.id===id))+' 正在派遣中，暂时不能设为亲代。');return;}if(b.disabled)return;chooseParent('a',id);"
          new="if(isDispatched(id)){tell(name(s.monsters.find(m=>m.id===id))+' 正在派遣中，暂时不能设为亲代。');return;}if(isInActiveExpedition(id)){tell(name(s.monsters.find(m=>m.id===id))+' 正在远征中，暂时不能设为亲代。');return;}if(b.disabled)return;chooseParent('a',id);"
          if old not in s: raise SystemExit('parent a picker target not found')
          s=s.replace(old,new,1)

          old="if(isDispatched(id)){tell(name(s.monsters.find(m=>m.id===id))+' 正在派遣中，暂时不能设为亲代。');return;}if(b.disabled)return;chooseParent('b',id);"
          new="if(isDispatched(id)){tell(name(s.monsters.find(m=>m.id===id))+' 正在派遣中，暂时不能设为亲代。');return;}if(isInActiveExpedition(id)){tell(name(s.monsters.find(m=>m.id===id))+' 正在远征中，暂时不能设为亲代。');return;}if(b.disabled)return;chooseParent('b',id);"
          if old not in s: raise SystemExit('parent b picker target not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
      - name: Checks
        run: |
          node --check game.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v207-expedition-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js .github/workflows/v207-expedition-lock.yml
          git commit -m "Lock expedition monsters from breeding and dispatch"
          git push
