name: Qinster v274 version badge
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v274-version-badge.py'
      - '.github/workflows/v274-version-badge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 scripts/patch-v274-version-badge.py
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v274
        run: |
          grep -q 'v274 · 等待' index.html
          grep -q 'id="engine-heartbeat">v274 · engine' index.html
          grep -q '"version": "274.0.0"' package.json
      - name: Commit generated changes and remove one-shot files
        run: |
          rm scripts/patch-v274-version-badge.py .github/workflows/v274-version-badge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix visible version badge v274'
          git push
