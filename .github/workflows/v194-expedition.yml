name: Qinster v194 expedition

on:
  push:
    paths:
      - '.github/workflows/v194-expedition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v194 patch
        run: |
          python3 scripts/v194_patch.py
          node --check game.js
          node --check v194-expedition.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v194-expedition.yml scripts/v194_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html v194-expedition.js .github/workflows/v194-expedition.yml scripts/v194_patch.py
          git commit -m "Add playable v194 grassland expedition"
          git push
