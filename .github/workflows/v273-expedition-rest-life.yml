name: Qinster v273 expedition rest life
on:
  push:
    paths:
      - 'scripts/patch-v273-expedition-rest-life.py'
      - '.github/workflows/v273-expedition-rest-life.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Apply patch
        run: python scripts/patch-v273-expedition-rest-life.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          node scripts/check-picker.mjs
      - name: Verify v273
        run: |
          grep -q "EXPEDITION_REST_MS=30\*60\*1000" v199-roguelike-expedition.js
          grep -q "function expeditionFailureDeathChance" v199-roguelike-expedition.js
          grep -q "重伤归来：剩余生命归0" v199-roguelike-expedition.js
          grep -q "每只参战怪物消耗1生命" v199-roguelike-expedition.js
          grep -q "战斗HP归0不会直接死亡" v199-roguelike-expedition.js
          grep -q "__qinsterVersion='v273'" game.js
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v273-expedition-rest-life.py .github/workflows/v273-expedition-rest-life.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign expedition life as rest stamina v273' || exit 0
          git push
