name: Qinster v213 speed KO replay

on:
  push:
    paths:
      - '.github/workflows/v213-speed-ko-replay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v213 patch
        run: python scripts/patch-v213-speed-ko-replay.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name "Qinster Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/v213-speed-ko-replay.yml
          git add v199-roguelike-expedition.js v201-battle-theater.js .github/workflows/v213-speed-ko-replay.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add speed initiative and fix KO replay"
          git push
