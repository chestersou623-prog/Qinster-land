name: Qinster v254 battle actor banner
on:
  push:
    paths:
      - 'scripts/patch-v254-battle-actor-banner.py'
      - '.github/workflows/v254-battle-actor-banner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-v254-battle-actor-banner.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify actor banner
        run: |
          grep -q "actorLabel" v201-battle-theater.js
          grep -q "game.js?v=254" index.html
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v254-battle-actor-banner.py .github/workflows/v254-battle-actor-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show battle actor in action banner v254"
          git push
