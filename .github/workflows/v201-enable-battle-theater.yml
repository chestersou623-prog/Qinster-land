name: Qinster v201 battle theater

on:
  push:
    paths:
      - '.github/workflows/v201-enable-battle-theater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable animated battle theater
        run: |
          node --check v201-battle-theater.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="v201-battle-theater.js?v=201"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body close tag not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v201-enable-battle-theater.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/v201-enable-battle-theater.yml
          git commit -m "Enable animated roguelike battle theater"
          git push
