name: Qinster v263 relic icon fallbacks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v263-relic-icon-fallbacks.py'
      - '.github/workflows/v263-relic-icon-fallbacks.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-v263-relic-icon-fallbacks.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: npm test
      - name: Verify relic icon fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v199-roguelike-expedition.js').read_text(encoding='utf-8')
          x=Path('index.html').read_text(encoding='utf-8')
          for key in ['phoenixCore','energyShield100','vulnerabilityMark','bossBreaker','digitChaosCube']:
              assert key in s
          assert 'RELIC_ICON_FALLBACKS' in s
          assert "fateWeight.png?v=263" in s
          assert "assets/relics/${assetId}.png?v=263" in s
          assert "version:'v263'" in s
          assert 'v=263' in x
          print('v263 relic icon verification passed')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v263-relic-icon-fallbacks.py .github/workflows/v263-relic-icon-fallbacks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add reliable relic icon fallbacks v263'
          git push