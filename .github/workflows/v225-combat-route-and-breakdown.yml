name: Qinster v225 combat route and breakdown
on:
  push:
    paths:
      - 'scripts/patch-v225-combat-route-and-breakdown.py'
      - '.github/workflows/v225-combat-route-and-breakdown.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v225 patch
        run: python scripts/patch-v225-combat-route-and-breakdown.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Make expedition combat-heavy and explain stat modifiers'
            git push
          fi
