name: Qinster v193 race stats and roster UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v193-race-stats-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch v193
        run: |
          echo '  mFsdWUqPTErLjAyNSpsdjsKICAgIHJldHVybiBNYXRoLm1heChsbyxNYXRoLm1pbihoaSxNYXRoLnJvdW5kKHZhbHVlKSkpO wogIH0pOwp9CicnJwpuZXc9Jyd' | base64 -d > /tmp/v193.py
          python3 /tmp/v193.py
          node --check game.js
          npm test
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/v193-race-stats-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html .github/workflows/v193-race-stats-ui.yml
          git commit -m "Add v193 race stats table and compact roster filters"
          git push
