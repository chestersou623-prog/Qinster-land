name: Qinster v193 loader

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v193-race-stats-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load v193 module
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"v193-race-stats.js\"></script>'; s=s if tag in s else s.replace('</body>',tag+'</body>'); p.write_text(s,encoding='utf-8')"
          grep -q 'v193-race-stats.js' index.html
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/v193-race-stats-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v193-race-stats.js .github/workflows/v193-race-stats-ui.yml
          git commit -m "Load v193 race stats and compact roster UI"
          git push
