name: Qinster v267 expedition box split
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v267-expedition-box.py'
      - 'scripts/patch-v267-picker-test.py'
      - '.github/workflows/v267-expedition-box.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: |
          python3 scripts/patch-v267-expedition-box.py
          python3 scripts/patch-v267-picker-test.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v267
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e=Path('v199-roguelike-expedition.js').read_text()
          b=Path('v201-battle-theater.js').read_text()
          g=Path('game.js').read_text()
          i=Path('index.html').read_text()
          p=Path('package.json').read_text()
          t=Path('scripts/check-picker.mjs').read_text()
          checks=[
            ('box capacity','boxCapacity' in e),
            ('transfer timestamp','expeditionTransferredAt' in e),
            ('species multipliers','speciesBattleMultipliers' in e),
            ('expedition trait','expeditionTraitFor' in e),
            ('box eligible','return (e.box||[]).filter' in e),
            ('box tab','data-rg-idle-tab="box"' in e),
            ('battle theater box','s?.expedition?.box' in b),
            ('expedition version',"version:'v267'" in e),
            ('visible version',"__qinsterVersion='v267'" in g),
            ('cache version','game.js?v=267' in i and 'v199-roguelike-expedition.js?v=267' in i),
            ('package version','"version": "267.0.0"' in p),
            ('picker regression','s.expedition.box=s.monsters.slice(0,6)' in t),
          ]
          bad=[n for n,ok in checks if not ok]
          if bad: raise SystemExit('verification failed: '+', '.join(bad))
          print('v267 verification ok')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-v267-expedition-box.py scripts/patch-v267-picker-test.py .github/workflows/v267-expedition-box.yml
          git add -A
          git commit -m 'Split ranch and expedition boxes v267'
          git push
