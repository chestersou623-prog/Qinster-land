name: Qinster v256 early boss evacuation
on:
  push:
    paths:
      - 'scripts/patch-v256-early-boss-evac.py'
      - '.github/workflows/v256-early-boss-evac.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-v256-early-boss-evac.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Show generated evacuation diff
        run: git diff -- v199-roguelike-expedition.js | sed -n '1,220p'
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v256-early-boss-evac.py .github/workflows/v256-early-boss-evac.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Add early boss evacuation points v256'
            git push
          fi
