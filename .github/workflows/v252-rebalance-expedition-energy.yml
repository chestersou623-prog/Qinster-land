name: Qinster v252 rebalance expedition energy

on:
  push:
    paths:
      - '.github/workflows/v252-rebalance-expedition-energy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v252-rebalance-expedition-energy.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify reward rebalance
        run: |
          grep -F "base=Math.round(400*nodeRewardScale" v199-roguelike-expedition.js
          grep -F "gain=Math.round(300*nodeRewardScale" v199-roguelike-expedition.js
          grep -F "base=Math.round(500*(elite?1.7:1)*(boss?2.8:1)*nodeRewardScale" v199-roguelike-expedition.js
          grep -F "game.js?v=252" index.html
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html v199-roguelike-expedition.js v201-battle-theater.js
          git rm scripts/patch-v252-rebalance-expedition-energy.py .github/workflows/v252-rebalance-expedition-energy.yml
          git diff --cached --quiet && exit 0
          git commit -m "Rebalance expedition energy rewards v252"
          git push
