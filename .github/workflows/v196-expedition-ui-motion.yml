name: Qinster v196 expedition UI motion

on:
  push:
    paths:
      - '.github/workflows/v196-expedition-ui-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch expedition interaction and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v194-expedition.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let selected=[],selectedZone='d1',sortMode='recommended';","let selected=[],selectedZone='d1',sortMode='recommended',resolving=false;",1)
          old="function saveRender(msg){const R=rt();if(!R)return;const s=state();if(s)s.revision=(s.revision||0)+1;R.save?.();R.render?.();if(msg)R.tell?.(msg);render();}"
          new="function syncExpeditionMotion(){const marker=document.querySelector('[data-exp-party]');if(!marker)return;const from=Math.max(0,Math.min(5,Number(marker.dataset.from)||0)),to=Math.max(0,Math.min(5,Number(marker.dataset.step)||0)),pos=n=>8+(84*n/5);marker.style.left=pos(from)+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{marker.style.left=pos(to)+'%';if(from!==to)marker.classList.add('moving');}));if(from!==to)setTimeout(()=>marker.classList.remove('moving'),520);}function saveRender(msg){const R=rt();if(!R)return;const s=state();if(s)s.revision=(s.revision||0)+1;R.save?.();R.render?.();if(msg)R.tell?.(msg);render();requestAnimationFrame(syncExpeditionMotion);}"
          if old not in s: raise SystemExit('saveRender marker not found')
          s=s.replace(old,new,1)
          s=s.replace("e.active={zone:z.id,teamIds:[...selected],route:makeRoute(),step:0,stamina:3,reward:0,success:0,fail:0,log:[]};","e.active={zone:z.id,teamIds:[...selected],route:makeRoute(),step:0,visualFrom:0,stamina:3,reward:0,success:0,fail:0,log:[]};",1)
          s=s.replace("function finish(defeated=false){\n  const s=state(),e=ensure(),a=e?.active;if(!s||!e||!a)return;","function finish(defeated=false){\n  resolving=false;\n  const s=state(),e=ensure(),a=e?.active;if(!s||!e||!a)return;",1)
          choose_pat=r"function choose\(idx\)\{.*?\n\}\nfunction abandon"
          choose_new="""function choose(idx){
  if(resolving)return;
  const e=ensure(),a=e?.active;if(!a)return;const z=zone(a.zone);
  const event=EVENTS[a.route[a.step]],choice=event?.choices?.[idx];if(!choice)return;
  resolving=true;const fromStep=a.step;
  const t=a.teamIds.map(id=>(state().monsters||[]).find(m=>m.id===id)).filter(Boolean);
  if(t.length!==3){resolving=false;e.active=null;saveRender('远征队伍资料异常，本次远征已安全结束。');return;}
  const sc=eventScore(t,choice.stat),target=choice.diff+z.diffAdd,p=chance(sc,target),ok=Math.random()<p,reward=Math.round(choice.reward*z.rewardMul);
  if(ok){a.reward+=reward;a.success++;a.log.push('✓ '+event.title+' · '+STAT_NAMES[choice.stat]+' '+sc+' / '+target+' · 成功 +'+reward+' 灵能');}else{a.stamina--;a.fail++;a.log.push('× '+event.title+' · '+STAT_NAMES[choice.stat]+' '+sc+' / '+target+' · 失败，行动力 -1');}
  a.visualFrom=fromStep;a.step++;
  if(a.stamina<=0){finish(true);return;}if(a.step>=a.route.length){finish(false);return;}
  saveRender(ok?'挑战成功。继续深入'+z.name+'。':'挑战失败，但队伍还能继续前进。');setTimeout(()=>{resolving=false;},480);
}
function abandon"""
          s,n=re.subn(choose_pat,choose_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('choose block not found')
          s=s.replace("function zoneTabs(e){return '<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px\">'","function zoneTabs(e){return '<div class=\"exp-zone-tabs\">'",1)
          sel_start=s.index('function selectionHTML(z){'); sel_end=s.index('\nfunction activeHTML(a){',sel_start)
          sel_new="""function selectionHTML(z){
  const list=sortedEligible(z),recommended=new Set(recommendTeam(z).map(m=>m.id));
  const options=(slot)=>'<option value="">选择队员 '+(slot+1)+'</option>'+list.map((m,idx)=>'<option value="'+m.id+'" '+(selected[slot]===m.id?'selected':'')+'>'+(recommended.has(m.id)?'★推荐 '+(idx+1)+' · ':'')+stars(m)+(m.shiny?' ✦':'')+' '+n(m)+' · 总能力 '+stats(m).reduce((a,b)=>a+b,0)+'</option>').join('');
  const sort='<label class="exp-sort-label"><span>排序</span><select data-exp-sort><option value="recommended" '+(sortMode==='recommended'?'selected':'')+'>最佳推荐</option><option value="newest" '+(sortMode==='newest'?'selected':'')+'>加入时间 · 新 → 旧</option><option value="oldest" '+(sortMode==='oldest'?'selected':'')+'>加入时间 · 旧 → 新</option><option value="total" '+(sortMode==='total'?'selected':'')+'>总能力 · 高 → 低</option><option value="star" '+(sortMode==='star'?'selected':'')+'>星级 · 高 → 低</option><option value="luck" '+(sortMode==='luck'?'selected':'')+'>幸运 · 高 → 低</option></select></label>';
  return '<section class="exp-panel exp-team-builder"><div class="exp-section-title"><div><b>① 选择远征队伍</b><small>先选难度，再挑 3 只怪物</small></div><div class="exp-select-actions">'+sort+'<button type="button" class="secondary" data-exp-recommend>一键最佳推荐</button></div></div><div class="exp-select-grid">'+[0,1,2].map(i=>'<label><span>队员 '+(i+1)+'</span><select data-exp-slot="'+i+'">'+options(i)+'</select></label>').join('')+'</div></section>';
}
"""
          s=s[:sel_start]+sel_new+s[sel_end:]
          act_start=s.index('function activeHTML(a){'); act_end=s.index('\nfunction render(){',act_start)
          act_new="""function activeHTML(a){
  const z=zone(a.zone),t=a.teamIds.map(id=>(state().monsters||[]).find(m=>m.id===id)).filter(Boolean),event=EVENTS[a.route[a.step]];
  if(!event)return '<section class="exp-panel"><b>远征进度正在恢复…</b><p>请返回牧场后重新进入远征。</p></section>';
  const nodes=a.route.map((id,i)=>'<span class="exp-route-node '+(i<a.step?'done':i===a.step?'current':'')+'"><b>'+(i+1)+'</b><small>'+(i===5?'核心':'事件')+'</small></span>').join('');
  const from=Number.isFinite(Number(a.visualFrom))?Number(a.visualFrom):Math.max(0,a.step-1),party=t.map(m=>'<span class="exp-walker">'+(rt()?.sprite?.(m.species,m.tint,m.shiny,m.specialColor)||'')+'</span>').join('');
  const choices=event.choices.map((c,i)=>{const sc=eventScore(t,c.stat),target=c.diff+z.diffAdd,p=chance(sc,target),reward=Math.round(c.reward*z.rewardMul);return '<button class="exp-choice" data-exp-choice="'+i+'"><b>'+c.label+'</b><span>'+STAT_NAMES[c.stat]+' '+sc+' / '+target+'</span><small>成功率约 '+fmtPct(p)+'</small><em>成功 +'+reward+' 灵能</em></button>';}).join('');
  return '<div class="exp-active"><section class="exp-panel exp-active-head"><div><span class="exp-kicker">'+z.label+'</span><h3>'+z.name+'</h3><small>'+z.desc+'</small></div><div class="exp-run-stats"><b>行动力 '+('♥'.repeat(a.stamina))+('♡'.repeat(Math.max(0,3-a.stamina)))+'</b><span>暂存 '+a.reward+' 灵能</span><span>成功 '+a.success+' · 失败 '+a.fail+'</span></div></section><section class="exp-panel exp-route-panel"><div class="exp-section-title"><div><b>② 远征路线</b><small>点击事件后队伍会移动到下一节点</small></div><span>节点 '+(a.step+1)+' / '+a.route.length+'</span></div><div class="exp-route-stage"><div class="exp-route-line"></div><div class="exp-route-nodes">'+nodes+'</div><div class="exp-party-marker" data-exp-party data-from="'+from+'" data-step="'+a.step+'">'+party+'</div></div></section><section class="exp-panel"><div class="exp-section-title"><div><b>当前队伍</b><small>五项能力直接参与事件判定</small></div></div><div class="exp-team-strip">'+t.map(teamCard).join('')+'</div></section><section class="exp-panel exp-event"><span class="exp-kicker">③ 当前事件</span><h3>'+event.title+'</h3><p>'+event.text+'</p><div class="exp-choices">'+choices+'</div></section><details class="exp-panel exp-log"><summary>远征记录</summary>'+(a.log.length?a.log.slice(-4).reverse().map(x=>'<div>'+x+'</div>').join(''):'<div>队伍刚刚进入'+z.name+'。</div>')+'</details><button class="secondary exp-abandon" data-exp-abandon>结束本次远征</button></div>';
}
"""
          s=s[:act_start]+act_new+s[act_end:]
          old="box.innerHTML=zoneTabs(e)+'<div class=\"exp-overview\"><div><b>'+z.label+' · '+z.name+'</b><small>'+z.desc+'</small></div><div><b>今日剩余 '+remain+' / '+z.attempts+'</b><small>远征徽章 '+e.badges+' · 通关基础 '+z.badge+' 枚</small></div></div><p class=\"exp-intro\"><b>准入：'+requirement+'</b>。选择 3 只怪物后连续处理 6 个事件。星级只决定能否进入；真正的成功率由体质 / 攻击 / 防御 / 速度 / 幸运决定。失败只消耗本次远征行动力，不直接扣怪物生命。</p>'+selectionHTML(z)+'<div class=\"exp-team-strip\">'+t.map(teamCard).join('')+'</div><button class=\"primary exp-start\" data-exp-start '+(t.length===3&&remain>0?'':'disabled')+'>开始 '+z.label+' · '+z.name+'</button>'+(e.lastResult?'<div class=\"exp-last\">上次：'+(e.lastResult.zoneName||'远征')+' · '+(e.lastResult.defeated?'提前结束':'完成')+' · '+e.lastResult.success+' 成功 / '+e.lastResult.fail+' 失败 · '+e.lastResult.payout+' 灵能'+(e.lastResult.badge?' · 徽章 ×'+e.lastResult.badge:'')+'</div>':'');"
          new="box.innerHTML='<section class=\"exp-panel\"><div class=\"exp-section-title\"><div><b>选择难度</b><small>每个难度每天独立计算次数</small></div><strong class=\"exp-badge-count\">徽章 '+e.badges+'</strong></div>'+zoneTabs(e)+'</section><section class=\"exp-panel exp-overview\"><div><span class=\"exp-kicker\">'+z.label+'</span><b>'+z.name+'</b><small>'+z.desc+'</small></div><div><b>今日剩余 '+remain+' / '+z.attempts+'</b><small>通关基础 '+z.badge+' 枚徽章</small></div><div><b>准入：'+requirement+'</b><small>星级只决定准入，能力决定成功率</small></div></section>'+selectionHTML(z)+'<section class=\"exp-panel\"><div class=\"exp-section-title\"><div><b>当前选择</b><small>已选 '+t.length+' / 3</small></div></div><div class=\"exp-team-strip\">'+t.map(teamCard).join('')+'</div><button class=\"primary exp-start\" data-exp-start '+(t.length===3&&remain>0?'':'disabled')+'>开始 '+z.label+' · '+z.name+'</button></section>'+(e.lastResult?'<div class=\"exp-last exp-panel\">上次：'+(e.lastResult.zoneName||'远征')+' · '+(e.lastResult.defeated?'提前结束':'完成')+' · '+e.lastResult.success+' 成功 / '+e.lastResult.fail+' 失败 · '+e.lastResult.payout+' 灵能'+(e.lastResult.badge?' · 徽章 ×'+e.lastResult.badge:'')+'</div>':'');"
          if old not in s: raise SystemExit('idle render line not found')
          s=s.replace(old,new,1)
          s=s.replace("window.QinsterExpedition={render,zones:ZONES};","window.QinsterExpedition={render:()=>{render();requestAnimationFrame(syncExpeditionMotion);},zones:ZONES};",1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html');h=p.read_text(encoding='utf-8')
          css='/* ===== v196 expedition hierarchy + moving route ===== */\n#expedition-page{max-width:1220px;margin:0 auto}.expedition-content{display:grid;gap:12px}.exp-panel{background:#c8c7cc;border:3px solid #57535e;box-shadow:inset 0 0 0 2px #aaa7af;padding:11px}.exp-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.exp-section-title small{display:block;margin-top:3px;font-size:9px;color:#625d68}.exp-kicker{display:block;font-size:9px;font-weight:900;color:#8b2e29}.exp-badge-count{background:#302d36;color:#f2c451;padding:6px 9px;border:2px solid #706b76}.exp-zone-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.exp-zone-tabs button{min-height:60px;text-align:left}.exp-overview{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:8px}.exp-overview>div{background:#d8d7da;border:2px solid #8a8690;padding:9px}.exp-overview b,.exp-overview small{display:block}.exp-overview small{margin-top:4px;font-size:9px}.exp-select-actions{display:flex;align-items:end;gap:7px;flex-wrap:wrap}.exp-sort-label{min-width:220px}.exp-sort-label span,.exp-select-grid label>span{display:block;margin-bottom:4px;font-size:9px;font-weight:900}.exp-sort-label select,.exp-select-grid select{width:100%}.exp-select-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.exp-team-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.exp-start{width:100%;margin-top:10px;padding:12px}.exp-active-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.exp-active-head h3{margin:2px 0 3px}.exp-run-stats{display:flex;gap:8px;flex-wrap:wrap}.exp-run-stats>*{background:#302d36;color:#fff1b5;border:2px solid #716d77;padding:6px 8px;font-size:9px}.exp-route-stage{position:relative;height:118px;margin-top:4px;padding:0 18px}.exp-route-line{position:absolute;left:8%;right:8%;top:55px;height:5px;background:#85808a;border:1px solid #5c5761}.exp-route-nodes{position:absolute;left:8%;right:8%;top:34px;display:flex;justify-content:space-between}.exp-route-node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;align-content:center;background:#aaa8ae;border:3px solid #6e6974;z-index:2}.exp-route-node small{font-size:7px}.exp-route-node.done{background:#93b68a;border-color:#4e7149}.exp-route-node.current{background:#f2cf62;border-color:#7f651d}.exp-party-marker{position:absolute;top:72px;left:8%;transform:translateX(-50%);display:flex;align-items:flex-end;transition:left .46s steps(5,end);z-index:4;pointer-events:none}.exp-party-marker.moving{animation:expBob .18s steps(2,end) infinite}.exp-walker{display:block;width:33px;margin-left:-7px}.exp-walker:first-child{margin-left:0}.exp-walker .sprite{width:33px!important}.exp-event{background:#dedde0}.exp-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.exp-choice{display:grid;grid-template-columns:1fr auto;gap:4px;text-align:left}.exp-choice b,.exp-choice em{grid-column:1/-1}.exp-choice span,.exp-choice small,.exp-choice em{font-size:9px}.exp-choice em{font-style:normal;font-weight:900}.exp-log summary{cursor:pointer;font-weight:900}.exp-log div{padding:3px 0;border-top:1px dashed #96919b}.exp-abandon{width:100%}@keyframes expBob{50%{transform:translateX(-50%) translateY(-3px)}}@media(max-width:760px){.exp-zone-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.exp-overview,.exp-select-grid,.exp-team-strip,.exp-choices{grid-template-columns:1fr}.exp-active-head,.exp-section-title{display:grid}.exp-route-stage{height:106px}.exp-route-node{width:34px;height:34px}.exp-party-marker{top:66px}.exp-walker{width:28px}.exp-walker .sprite{width:28px!important}}\n'
          if '/* ===== v196 expedition hierarchy + moving route ===== */' not in h:
              marker='</style>\n<body>'
              if marker not in h: raise SystemExit('style marker not found')
              h=h.replace(marker,css+'</style>\n<body>',1)
          p.write_text(h,encoding='utf-8')
          PY
          node --check v194-expedition.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v196-expedition-ui-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v194-expedition.js index.html .github/workflows/v196-expedition-ui-motion.yml
          git commit -m "Fix expedition progression motion and reorganize UI"
          git push
