name: Qinster v241 endless stats and rewards

on:
  push:
    paths:
      - 'scripts/patch-v241-endless-stats-rewards.py'
      - '.github/workflows/v241-endless-stats-rewards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v241-endless-stats-rewards.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Tests
        run: npm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js game.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix endless stat scaling and floor reward bonus"
            git push
          fi
