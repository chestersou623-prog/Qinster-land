name: Relic icon validation
on:
  push:
    paths:
      - 'v199-roguelike-expedition.js'
      - 'assets/relics/**'
      - 'assets/relic-icons*.webp'
      - 'scripts/check-relics.mjs'
      - '.github/workflows/v229-relic-icon-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production code and relic mappings
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          node scripts/check-relics.mjs
          npm test
