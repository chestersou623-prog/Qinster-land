name: Qinster v218 filter formation events
on:
  push:
    paths:
      - 'scripts/patch-v218-filter-formation-events.py'
      - '.github/workflows/v218-filter-formation-events.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v218 patch
        run: python scripts/patch-v218-filter-formation-events.py
      - name: Checks
        run: |
          node --check game.js
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add game.js v199-roguelike-expedition.js v201-battle-theater.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix debuff filter formation and event results'
            git push
          fi
