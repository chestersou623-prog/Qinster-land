name: Qinster v246 ally final stats

on:
  push:
    paths:
      - '.github/workflows/v246-ally-final-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-v246-ally-final-stats.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Tests
        run: npm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/v246-ally-final-stats.yml scripts/patch-v246-ally-final-stats.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Show player final combat stats v246"
          git push
