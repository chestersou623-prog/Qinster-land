name: Qinster v212 theater enemy visual

on:
  push:
    paths:
      - '.github/workflows/v212-theater-enemy-visual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v212 patch
        run: python scripts/patch-v212-theater-enemy-visual.py
      - name: Checks
        run: |
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name "Qinster Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/v212-theater-enemy-visual.yml
          git add v201-battle-theater.js .github/workflows/v212-theater-enemy-visual.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix enemy sprite and info placement in battle theater"
          git push
