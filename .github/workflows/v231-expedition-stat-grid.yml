name: Qinster v231 expedition stat grid
on:
  push:
    paths:
      - 'scripts/patch-v231-expedition-stat-grid.py'
      - '.github/workflows/v231-expedition-stat-grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v231 patch
        run: python scripts/patch-v231-expedition-stat-grid.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js game.js index.html scripts/check-game.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix expedition stat card layout and bump v231'
            git push
          fi
