name: Qinster v248 real HP retry

on:
  push:
    paths:
      - '.github/workflows/v248-real-hp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v248-real-hp.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify real HP conversion
        run: |
          grep -F "const STAT=['HP','攻击','防御','速度','幸运']" v199-roguelike-expedition.js
          grep -F "hpDamage" v199-roguelike-expedition.js
          grep -F "data-bt-ally-hptext" v201-battle-theater.js
          grep -F "game.js?v=248" index.html
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html v199-roguelike-expedition.js v201-battle-theater.js
          git rm scripts/patch-v248-real-hp.py .github/workflows/v248-real-hp.yml
          git diff --cached --quiet && exit 0
          git commit -m "Convert constitution into real HP v248"
          git push
