name: Qinster v241 endless reward scaling

on:
  push:
    paths:
      - 'scripts/patch-v241-endless-reward-scaling.py'
      - '.github/workflows/v241-endless-reward-scaling.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v241-endless-reward-scaling.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Tests
        run: npm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js game.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix endless enemy and reward scaling"
          git push
