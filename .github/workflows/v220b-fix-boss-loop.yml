name: Qinster v220b fix boss loop
on:
  push:
    paths:
      - '.github/workflows/v220b-fix-boss-loop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply hotfix
        run: python scripts/patch-v220b-boss-loop.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          npm test
          python - <<'PY'
          from pathlib import Path
          s=Path('v199-roguelike-expedition.js').read_text()
          assert "v220b-fix-boss-loop" in s
          assert "run.options=makeOptions(run.stage)" in s
          assert "if(run.stage>=8){run.options=[{type:'boss'}]}" not in s
          print('v220b checks ok')
          PY
      - name: Commit hotfix
        run: |
          rm -f .github/workflows/v220b-fix-boss-loop.yml
          git config user.name "Qinster Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add v199-roguelike-expedition.js scripts/patch-v220b-boss-loop.py .github/workflows/v220b-fix-boss-loop.yml
          git commit -m "Fix expedition boss loop after first checkpoint"
          git push
