name: Qinster v260 core relics retry
on:
  push:
    paths:
      - '.github/workflows/v260-core-relics-retry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix patch typo and apply
        run: |
          sed -i 's/^P\.write_text/p.write_text/' scripts/patch-v260-core.py
          python scripts/patch-v260-core.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify v260 core mechanics
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v199-roguelike-expedition.js').read_text()
          checks=['phoenixCore','absoluteGuard','energyShield100','vulnerabilityMark','armorBreakSeal','relicWarBanner','buffResonator','digitChaosCube','formationCompass','dodgeCounterBlade','con*=1.25','atk*=1.25','shieldDamage','autoRevived','enemyVulnerable','stackVulnerable']
          miss=[x for x in checks if x not in s]
          assert not miss, miss
          assert 'v=260' in Path('index.html').read_text()
          print('v260 core verified')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v260-core.py .github/workflows/v260-core-relics.yml .github/workflows/v260-core-relics-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add formation shields revival and vulnerability relics v260" || exit 0
          git push
