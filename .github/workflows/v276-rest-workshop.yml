name: Qinster v276 rest timer workshop

on:
  push:
    paths:
      - '.github/workflows/v276-rest-workshop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Apply patch
        run: python3 scripts/patch-v276-rest-workshop.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v276
        run: |
          grep -F 'data-rg-rest-id' v199-roguelike-expedition.js
          grep -F 'setInterval(refreshRestCountdowns,1000)' v199-roguelike-expedition.js
          grep -F '蛋位 ${eggs}/11' v199-roguelike-expedition.js
          grep -F "available(x)>=x.cost?'':'disabled'" v199-roguelike-expedition.js
          grep -F 'v276 · engine' index.html
          grep -F '"version": "276.0.0"' package.json
          grep -F 'v199-roguelike-expedition.js?v=276' index.html
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-v276-rest-workshop.py .github/workflows/v276-rest-workshop.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix rest countdown and fragment workshop feedback v276"
          git push
