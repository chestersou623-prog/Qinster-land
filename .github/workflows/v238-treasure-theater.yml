name: Qinster v238 treasure and battle playback
on:
  push:
    paths:
      - 'scripts/patch-v238-treasure-theater.py'
      - '.github/workflows/v238-treasure-theater.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v238-treasure-theater.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Tests
        run: npm test
      - name: Commit generated changes
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js v201-battle-theater.js game.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Show treasure rewards and sync battle action playback v238'
          git push