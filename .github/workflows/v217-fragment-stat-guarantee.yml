name: Qinster v217 fragment stat guarantee

on:
  push:
    paths:
      - '.github/workflows/v217-fragment-stat-guarantee.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v217 patch
        run: python scripts/patch-v217-fragment-stat-guarantee.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          npm test
      - name: Commit patch
        run: |
          git config user.name "Qinster Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/v217-fragment-stat-guarantee.yml
          git add v199-roguelike-expedition.js .github/workflows/v217-fragment-stat-guarantee.yml
          git diff --cached --quiet && exit 0
          git commit -m "Guarantee high stats for fragment eggs"
          git push
