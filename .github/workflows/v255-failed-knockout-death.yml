name: Qinster v255 failed knockout death
on:
  push:
    paths:
      - 'scripts/patch-v255-failed-knockout-death.py'
      - '.github/workflows/v255-failed-knockout-death.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-v255-failed-knockout-death.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify death sink
        run: |
          grep -q "远征失败阵亡" v199-roguelike-expedition.js
          grep -q "applyExpeditionLifeCost(run,cleared,defeated)" v199-roguelike-expedition.js
          grep -q "已从Box移除" v199-roguelike-expedition.js
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v255-failed-knockout-death.py .github/workflows/v255-failed-knockout-death.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Make failed expedition knockouts die v255'
            git push
          fi
