name: Qinster v243 restore simultaneous ATB

on:
  push:
    paths:
      - 'scripts/patch-v243-restore-simultaneous-atb.py'
      - '.github/workflows/v243-restore-simultaneous-atb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch-v243-restore-simultaneous-atb.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Tests
        run: npm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v201-battle-theater.js game.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore simultaneous ATB replay v243"
          git push
