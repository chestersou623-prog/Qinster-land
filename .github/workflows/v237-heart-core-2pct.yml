name: Qinster v237 life core balance
on:
  push:
    paths:
      - 'scripts/patch-v237-heart-core-2pct.py'
      - '.github/workflows/v237-heart-core-2pct.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v237 patch
        run: python scripts/patch-v237-heart-core-2pct.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check game.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js game.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Reduce Life Core healing to 2 percent and bump v237'
            git push
          fi
