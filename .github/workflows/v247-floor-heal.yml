name: Qinster v247 floor transition heal
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v247-floor-heal.py'
      - '.github/workflows/v247-floor-heal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-v247-floor-heal.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Tests
        run: npm test
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v247-floor-heal.py .github/workflows/v247-floor-heal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore 50 percent HP between expedition floors v247"
          git push
