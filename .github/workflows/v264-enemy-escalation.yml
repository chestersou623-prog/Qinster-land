name: Qinster v264 enemy escalation
on:
  push:
    paths:
      - 'scripts/patch-v264-enemy-escalation.py'
      - '.github/workflows/v264-enemy-escalation.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-v264-enemy-escalation.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: npm test
      - name: Verify v264
        run: |
          grep -q "function enemySkillRoll" v199-roguelike-expedition.js
          grep -q "floor>=3?5" v199-roguelike-expedition.js
          grep -q "bossMax=d.id>=9?2:1" v199-roguelike-expedition.js
          grep -q "eliteMax=d.id>=6?2:1" v199-roguelike-expedition.js
          grep -q "version:'v264'" v199-roguelike-expedition.js
      - name: Commit generated changes and remove one-shot files
        run: |
          rm scripts/patch-v264-enemy-escalation.py .github/workflows/v264-enemy-escalation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Escalate enemy teams and skills v264'
          git push
