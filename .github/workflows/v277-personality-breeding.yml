name: Qinster v277 personality breeding

on:
  push:
    paths:
      - '.github/workflows/v277-personality-breeding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Apply patch
        run: python3 scripts/patch-v277-personality-breeding.py
      - name: Syntax checks
        run: |
          node --check game.js
          node --check v199-roguelike-expedition.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v277
        run: |
          grep -F "PERSONALITY_STAT_MODS" game.js
          grep -F "function rollChildTrait" game.js
          grep -F "function applySharedHighStatGenes" game.js
          grep -F "breedingPersonalityPreviewHTML" game.js
          grep -F "speciesBias*.30+geneBias*.50+.10" game.js
          grep -F "window.__qinsterVersion='v277'" game.js
          grep -F "v277 · engine" index.html
          grep -F '"version": "277.0.0"' package.json
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-v277-personality-breeding.py .github/workflows/v277-personality-breeding.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add personality-driven breeding and stat tendencies v277"
          git push
