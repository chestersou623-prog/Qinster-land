name: Qinster v271 shiny picker enemy formation
on:
  push:
    paths:
      - 'scripts/patch-v271-shiny-fragments-picker-enemy-names.py'
      - 'scripts/patch-v271-manual-formation.py'
      - '.github/workflows/v271-shiny-picker-enemy-formation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply patches
        run: |
          python3 scripts/patch-v271-shiny-fragments-picker-enemy-names.py
          python3 scripts/patch-v271-manual-formation.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v271
        run: |
          grep -q "shinyExpedition" v199-roguelike-expedition.js
          grep -q "闪光远征蛋" v199-roguelike-expedition.js
          grep -q "shinyChance=z(run.zone).shinyOnly?.35:.25" v199-roguelike-expedition.js
          grep -q "远征五维" v199-roguelike-expedition.js
          grep -q "data-rg-set-position" v199-roguelike-expedition.js
          grep -q "setFormationPosition" v199-roguelike-expedition.js
          grep -q "totals=roles.reduce" v199-roguelike-expedition.js
          grep -q "version:'v271'" v199-roguelike-expedition.js
          grep -q "__qinsterVersion='v271'" game.js
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v271-shiny-fragments-picker-enemy-names.py scripts/patch-v271-manual-formation.py .github/workflows/v271-shiny-picker-enemy-formation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add shiny fragment crafting picker stats enemy labels and manual formation v271'
          git push
