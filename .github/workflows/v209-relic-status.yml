name: Qinster v209 relic status

on:
  push:
    paths:
      - '.github/workflows/v209-relic-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply relic status patch
        run: |
          python3 scripts/patch-v209-relic-status.py
          node --check v199-roguelike-expedition.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v209-relic-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js .github/workflows/v209-relic-status.yml
          git commit -m "Show expedition team status during relic choices"
          git push
