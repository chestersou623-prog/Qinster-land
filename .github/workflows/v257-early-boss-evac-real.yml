name: Qinster v257 early boss evacuation real
on:
  push:
    paths:
      - 'scripts/patch-v257-early-boss-evac-real.py'
      - '.github/workflows/v257-early-boss-evac-real.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-v257-early-boss-evac-real.py
      - name: Syntax check expedition
        run: node --check v199-roguelike-expedition.js
      - name: Syntax check theater
        run: node --check v201-battle-theater.js
      - name: Syntax check game
        run: node --check game.js
      - name: Tests
        run: npm test
      - name: Verify generated evacuation code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v199-roguelike-expedition.js').read_text(encoding='utf-8')
          assert "early=current<=2" in s
          assert "finish(run,false,false" in s
          assert "floorNo(run.stage)<=2" in s
          assert "撤离并结束" in s
          print('v257 evacuation code present')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v257-early-boss-evac-real.py .github/workflows/v257-early-boss-evac-real.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Add working early boss evacuation points v257'
            git push
          fi
