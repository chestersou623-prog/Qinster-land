name: Qinster v204 expedition attempt potion

on:
  push:
    paths:
      - '.github/workflows/v204-expedition-attempt-potion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply attempt potion patch
        run: |
          python3 scripts/patch-v204-attempt-potion.py
          node --check v199-roguelike-expedition.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v204-expedition-attempt-potion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js .github/workflows/v204-expedition-attempt-potion.yml
          git commit -m "Add expedition attempt recovery potion"
          git push
