name: Qinster v223 route erosion
on:
  push:
    paths:
      - 'scripts/patch-v223-route-erosion.py'
      - '.github/workflows/v223-route-erosion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply pending enemy HP patch
        run: python scripts/patch-v221-enemy-hp.py
      - name: Apply v223 route erosion patch
        run: python scripts/patch-v223-route-erosion.py
      - name: Checks
        run: |
          node --check game.js
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add route erosion debuff and tougher enemy HP'
            git push
          fi
