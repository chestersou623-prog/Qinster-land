name: Qinster v224b fixed expedition
on:
  push:
    paths:
      - 'scripts/patch-v224b-fixed-expedition-difficulty.py'
      - '.github/workflows/v224b-fixed-expedition.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply fixed difficulty patch
        run: python scripts/patch-v224b-fixed-expedition-difficulty.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          npm test
      - name: Commit patch
        run: |
          git config user.name 'Qinster Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v199-roguelike-expedition.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Use fixed expedition difficulty curve'
            git push
          fi
