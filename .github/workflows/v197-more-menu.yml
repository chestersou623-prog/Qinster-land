name: Qinster v197 More menu

on:
  push:
    paths:
      - '.github/workflows/v197-more-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add More menu script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="v197-more-menu.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body end not found')
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check v197-more-menu.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v197-more-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v197-more-menu.js .github/workflows/v197-more-menu.yml
          git commit -m "Group low-frequency header actions under More menu"
          git push
