name: Qinster v208 battle preview

on:
  push:
    paths:
      - '.github/workflows/v208-battle-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply battle preview patch
        run: |
          python3 scripts/patch-v208-battle-preview.py
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          rm .github/workflows/v208-battle-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v199-roguelike-expedition.js .github/workflows/v208-battle-preview.yml
          git commit -m "Add battle preview and matched enemy cards"
          git push
