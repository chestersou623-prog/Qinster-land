name: Qinster v262 HP breakdown and skill RNG
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v262-hp-skill-rng.py'
      - '.github/workflows/v262-hp-skill-rng.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-v262-hp-skill-rng.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: npm test
      - name: Verify v262
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('v199-roguelike-expedition.js').read_text(encoding='utf-8')
          x=Path('index.html').read_text(encoding='utf-8')
          assert 'skillTurn=Math.random()<.20' in s
          assert '前卫站位：HP +25%' in s
          assert '80% 普通攻击，20% 使用战斗技能' in s
          assert 'v=262' in x
          print('v262 verification passed')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          rm -f scripts/patch-v262-hp-skill-rng.py .github/workflows/v262-hp-skill-rng.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve HP breakdown and randomize skill use v262'
          git push