name: Qinster v210b enemy sync theater

on:
  push:
    paths:
      - '.github/workflows/v210b-enemy-sync-theater.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v210b patch
        run: python scripts/patch-v210b-enemy-sync-theater.py
      - name: Checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          npm test
      - name: Commit patch
        run: |
          git config user.name "Qinster Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/v210b-enemy-sync-theater.yml
          git add v199-roguelike-expedition.js v201-battle-theater.js .github/workflows/v210b-enemy-sync-theater.yml
          git diff --cached --quiet && exit 0
          git commit -m "Sync enemy sprites and live HP updates (v210b)"
          git push
