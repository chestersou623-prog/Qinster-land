name: Qinster v279 monster detail dock

on:
  push:
    paths:
      - 'scripts/patch-v279-monster-detail-dock.py'
      - '.github/workflows/v279-monster-detail-dock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 scripts/patch-v279-monster-detail-dock.py
      - name: Syntax checks
        run: |
          node --check game.js
          node --check v199-roguelike-expedition.js
          node --check monster-detail-dock.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v279
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          game=Path('game.js').read_text()
          rg=Path('v199-roguelike-expedition.js').read_text()
          dock=Path('monster-detail-dock.js').read_text()
          pkg=Path('package.json').read_text()
          assert "const BUILD='v279'" in idx
          assert 'v279 · 等待' in idx and 'v279 · engine' in idx
          assert 'monster-detail-dock.js?v=279' in idx
          assert "window.__qinsterVersion='v279'" in game
          assert 'QinsterMonsterDock?.open?.()' in game
          assert 'scrollIntoView({behavior' not in game
          assert '/* Qinster release v279 */' in rg
          assert 'const maxHp=Math.round(1600*base*hpMul*endlessMul)' in rg
          assert "STORAGE_KEY='qinster-monster-detail-collapsed-v279'" in dock
          assert "document.body.classList.add('qinster-monster-dock-on')" in dock
          assert '"version": "279.0.0"' in pkg
          print('v279 verification passed')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game.js v199-roguelike-expedition.js package.json package-lock.json monster-detail-dock.js
          git rm scripts/patch-v279-monster-detail-dock.py .github/workflows/v279-monster-detail-dock.yml
          git commit -m 'Fix monster detail side dock v279'
          git push
