name: Qinster v269 transfer cost shiny bonus
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-v269-transfer-cost-shiny.py'
      - '.github/workflows/v269-transfer-cost-shiny.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 scripts/patch-v269-transfer-cost-shiny.py
      - name: Syntax checks
        run: |
          node --check v199-roguelike-expedition.js
          node --check v201-battle-theater.js
          node --check game.js
      - name: Tests
        run: |
          npm test
          npm run test:pickers
      - name: Verify v269
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e=Path('v199-roguelike-expedition.js').read_text()
          g=Path('game.js').read_text()
          i=Path('index.html').read_text()
          p=Path('package.json').read_text()
          checks=[
            ('cost function','function expeditionTransferCost' in e),
            ('price table','1:1000,2:3000,3:10000,4:25000,5:50000' in e),
            ('energy deduction','s.energy-=cost' in e),
            ('shiny multiplier',"m?.shiny?1.05:1" in e),
            ('shiny label','闪光加成' in e and '远征基础五维 +5%' in e),
            ('version',"version:'v269'" in e),
            ('visible version',"__qinsterVersion='v269'" in g),
            ('cache','game.js?v=269' in i and 'v199-roguelike-expedition.js?v=269' in i),
            ('package','"version": "269.0.0"' in p),
          ]
          bad=[n for n,ok in checks if not ok]
          if bad: raise SystemExit('verification failed: '+', '.join(bad))
          print('v269 verification ok')
          PY
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-v269-transfer-cost-shiny.py .github/workflows/v269-transfer-cost-shiny.yml
          git add -A
          git commit -m 'Add expedition transfer costs and shiny bonus v269'
          git push
